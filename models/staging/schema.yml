version: 2

models:
  - name: stg_amedas__stations
    description: AMeDAS 観測地点マスタ。1行 = 1地点。
    columns:
      - name: station_id
        description: 地点番号(5桁)。先頭2桁が気象庁の府県番号。
        tests: [not_null, unique]
      - name: pref_code
        description: 気象庁の府県番号(2桁)。seeds/jma_pref_codes と結合する。
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('jma_pref_codes')
                field: pref_code
      - name: latitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20
                max_value: 46
      - name: longitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 122
                max_value: 154

  - name: stg_amedas__observations
    description: 時別観測値。1行 = 1地点 × 1時刻。品質フラグが正常/準正常以外の値は null。
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, observed_at]
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_amedas__stations')
                field: station_id
      - name: observed_at
        tests: [not_null]
      - name: temperature_c
        description: 気温(℃)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -45
                max_value: 45
      - name: humidity_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: precipitation_1h_mm
        description: 前1時間降水量(mm)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
      - name: wind_speed_ms
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 90
